version: '3.8'

services:
  app:
    build: .
    ports:
      - '8001:8000'
    volumes:
      - .:/code
    environment:
      - PYTHONUNBUFFERED=1

  nginx:
    image: nginx:latest
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app